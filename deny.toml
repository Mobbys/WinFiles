# Controllo di licenze, vulnerabilità e provenienza delle dipendenze (cargo deny check).
# Regola del progetto: nessuna licenza copyleft forte (GPL, AGPL) nell'eseguibile distribuito.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser arriva solo su Linux, tramite le decorazioni Wayland di winit (sctk-adwaita).
    # Non entra nell'eseguibile Windows; da rivedere quando winit lo sostituisce.
    { id = "RUSTSEC-2026-0192", reason = "solo Linux, dipendenza indiretta di winit" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# I crate di WinFiles non si pubblicano: la loro licenza la decide il proprietario.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
