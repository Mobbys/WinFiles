# Controllo di licenze, vulnerabilità e provenienza delle dipendenze (cargo deny check).
# Regola del progetto: nessuna licenza copyleft forte (GPL, AGPL) nell'eseguibile distribuito.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser arriva solo su Linux, tramite le decorazioni Wayland di winit (sctk-adwaita).
    # Non entra nell'eseguibile Windows; da rivedere quando winit lo sostituisce.
    { id = "RUSTSEC-2026-0192", reason = "solo Linux, dipendenza indiretta di winit" },
    # rustybuzz non è più mantenuto (avviso, non una falla nota). Arriva con krilla 0.8, l'ultima
    # versione, e legge solo Inter incorporato nell'app, mai font presi dai file dei clienti.
    # Da togliere quando krilla passa a harfrust (vedi ADR 0008).
    { id = "RUSTSEC-2026-0206", reason = "non mantenuto; usato da krilla solo con Inter incorporato" },
    # proc-macro-error non è più mantenuto (avviso, non una falla): è una macro che gira solo in
    # compilazione, per winprint (stampa su Windows via craft-print). Vedi ADR 0009.
    { id = "RUSTSEC-2024-0370", reason = "macro di compilazione di winprint, non entra nell'eseguibile" },
    # zvariant, zvariant_derive e zbus_names non sono più mantenuti (avvisi, non falle note).
    # Arrivano solo su Linux, con l'accessibilità di egui (accesskit_unix, D-Bus): l'eseguibile
    # Windows non li contiene. Da togliere quando accesskit cambia libreria D-Bus.
    { id = "RUSTSEC-2026-0370", reason = "solo Linux, accessibilità di egui via D-Bus" },
    { id = "RUSTSEC-2026-0371", reason = "solo Linux, accessibilità di egui via D-Bus" },
    { id = "RUSTSEC-2026-0372", reason = "solo Linux, accessibilità di egui via D-Bus" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# I crate di WinFiles non si pubblicano: la loro licenza la decide il proprietario.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # I certificati radice di Mozilla come dati (webpki-root-certs): licenza permissiva per dati,
    # usata solo da uno strumento di compilazione di winprint (craft-print). Vedi ADR 0009.
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Le librerie ArtCraft, sempre a commit fissato.
# winprint.rs è la copia del team ArtCraft usata da craft-print per stampare su Windows.
# photocraft per il lettore HEIC (ADR 0012), pdfcraft per la modifica dei PDF (ADR 0015).
allow-git = ["https://github.com/storytold/craft-libs", "https://github.com/storytold/winprint.rs", "https://github.com/storytold/photocraft", "https://github.com/storytold/pdfcraft"]
