name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  controlli:
    name: Controlli (fmt, clippy, test, livelli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci

  licenze:
    name: Licenze e vulnerabilità
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  windows:
    name: Windows (test ed eseguibile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p winfiles
      - uses: actions/upload-artifact@v4
        with:
          name: winfiles-windows
          path: target/release/winfiles.exe
          if-no-files-found: error

  installer:
    name: Installer MSI
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: winfiles-windows
          path: windows
      - run: sudo apt-get update -q && sudo apt-get install -y -q wixl
      - run: installer/crea-msi.sh windows/winfiles.exe WinFiles.msi
      - uses: actions/upload-artifact@v4
        with:
          name: winfiles-installer
          path: WinFiles.msi
          if-no-files-found: error
