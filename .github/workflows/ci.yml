name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  controlli:
    name: Controlli (fmt, clippy, test, livelli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci

  licenze:
    name: Licenze e vulnerabilità
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # I test su Windows girano accanto all'eseguibile, non prima: l'exe da provare si scarica
  # appena è compilato, senza aspettare una seconda compilazione per i test.
  windows-test:
    name: Windows (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  windows:
    name: Windows (eseguibile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p winfiles -p winfiles-menu11 -p winfiles-preview
        env:
          # La chiave che crea solo issue su questo repository: Aiuto › Segnala un problema
          # (ADR 0029). Vuota nelle PR da fork: la finestra apre allora GitHub nel browser.
          WINFILES_SEGNALAZIONI: ${{ secrets.WINFILES_SEGNALAZIONI }}
      # Il pacchetto del menu di Windows 11 (ADR 0022), firmato con un certificato di prova,
      # registrato su questo PC e interrogato come fa Esplora file.
      - name: Menu di Windows 11 (prova)
        shell: powershell
        run: installer/crea-pacchetto-menu.ps1 -Versione 0.0.1 -Dll target/release/winfiles_menu11.dll -Exe target/release/winfiles.exe -Uscita menu -Prova
      # La DLL delle anteprime come la usa Esplora file: fabbrica, flusso del file, bitmap.
      - run: cargo test --release -p winfiles-preview
      - uses: actions/upload-artifact@v4
        with:
          name: winfiles-windows
          # La DLL delle anteprime in Esplora file (ADR 0036) va nell'MSI accanto all'eseguibile.
          path: |
            target/release/winfiles.exe
            target/release/winfiles_preview.dll
          if-no-files-found: error

  convertitori:
    uses: ./.github/workflows/convertitori.yml

  installer:
    name: Installer MSI
    needs: [windows, convertitori]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: winfiles-windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          pattern: convertitore-*
          path: convertitori
          merge-multiple: true
      - run: sudo apt-get update -q && sudo apt-get install -y -q wixl
      - run: installer/crea-msi.sh windows/winfiles.exe WinFiles.msi - convertitori
      - uses: actions/upload-artifact@v4
        with:
          name: winfiles-installer
          path: WinFiles.msi
          if-no-files-found: error
