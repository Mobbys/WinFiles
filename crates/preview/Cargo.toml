[package]
name = "winfiles-preview"
description = "Le anteprime dei file in Esplora file di Windows: PDF, AI, EPS, PSD, RAW, HEIC, SVG, DXF, DWG, PLT (ADR 0036)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
# La DLL che Esplora file carica (in un processo a parte, dllhost) per disegnare le anteprime:
# winfiles_preview.dll.
crate-type = ["cdylib", "rlib"]

# Esplora file chiede le anteprime attraverso COM: puntatori grezzi e funzioni esportate, quindi
# `unsafe` è inevitabile, come nella DLL del menu (ADR 0022), confinato in `com.rs`.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
winfiles-model.workspace = true
winfiles-thumbs.workspace = true
winfiles-cad.workspace = true

# Le stesse versioni della DLL del menu (MIT/Apache, già nel progetto).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
