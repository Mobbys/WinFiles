[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/winfiles", "xtask"]
# Copie modificate di librerie esterne, fuori dai controlli del workspace (vedi vendor/README.md).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-WinFiles-Proprietary"
rust-version = "1.95"
repository = "https://github.com/Mobbys/WinFiles"

[workspace.dependencies]
# interni
winfiles-geom = { path = "crates/geom", version = "0.1.0" }
winfiles-model = { path = "crates/model", version = "0.1.0" }
winfiles-layout = { path = "crates/layout", version = "0.1.0" }
winfiles-formats = { path = "crates/formats", version = "0.1.0" }
winfiles-thumbs = { path = "crates/thumbs", version = "0.1.0" }
winfiles-scene = { path = "crates/scene", version = "0.1.0" }
winfiles-pdf-out = { path = "crates/pdf_out", version = "0.1.0" }

# base
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
proptest = "1"

# lettura dei file (vedi docs/adr/0005-misure-dei-file.md)
hayro-syntax = { version = "0.8", default-features = false, features = ["std"] }
# miniature (vedi docs/adr/0006-miniature.md)
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "gif", "bmp", "webp"] }

# PDF in uscita (vedi docs/adr/0008-esportazione-pdf.md): testi con i font incorporati, immagini
# e pagine dei PDF originali incorporate come vettori.
krilla = { version = "0.8", default-features = false, features = ["raster-images", "simple-text"] }

# interfaccia
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# Finestre di sistema per aprire e salvare il progetto (Fase 1): su Windows usa il dialogo
# comune di Esplora file, su Linux il portale XDG. Licenza MIT.
rfd = "0.17"
# Appunti con testo e HTML insieme ("Copia tabella", Fase 6): Excel e Word incollano la tabella
# formattata, il Blocco note il testo. Già usato da egui-winit. Licenza MIT/Apache.
arboard = "3.6"
# Pannelli agganciabili e icone delle app ArtCraft, a commit fissato (vedi CLAUDE.md).
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df", features = ["serde"] }
# Stampa (Fase 5): il PDF dei fogli allo spooler, alla misura vera. Su Windows nel processo, senza
# script né programmi esterni; su Linux e macOS con CUPS. Stesso commit di craft-ui (ADR 0009).
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# hayro-interpret 0.8.0 con la sovrastampa simulata (ADR 0011): finché non è nella versione
# ufficiale, la copia modificata in vendor/.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
